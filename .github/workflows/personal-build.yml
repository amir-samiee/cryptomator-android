name: Release APK (Personal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK signed with debug key
        env:
          DROPBOX_API_KEY: ${{ secrets.DROPBOX_API_KEY }}
          PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
        run: |
          ./gradlew assembleApkstoreRelease -Pandroid.injected.signing.store.file=presentation/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - uses: actions/upload-artifact@v4
        with:
          name: cryptomator-apkstore-release-debugkey
          path: presentation/build/outputs/apk/apkstore/release/*.apk
