name: Release APK (Personal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
        with:
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build release APK signed with debug key
        env:
          DROPBOX_API_KEY: ${{ secrets.DROPBOX_API_KEY }}
          PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
        run: |
          ./gradlew assembleApkstoreRelease -Pandroid.injected.signing.store.file=$(find $(pwd) -name debug.keystore) -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - uses: actions/upload-artifact@v4
        with:
          name: cryptomator-apkstore-release-debugkey
          path: "presentation/**/*.apk"
          # expected path: presentation/build/outputs/apk/apkstore/release/*.apk
